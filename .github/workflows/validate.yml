name: Validate venue monosashi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run audit

      - run: npm run lint
        working-directory: web

      - run: npm test
        working-directory: web

      - name: Confirm generated search data is current
        run: git diff --exit-code -- web/app/generated-data.ts

